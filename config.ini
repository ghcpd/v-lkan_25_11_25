# KGEB Configuration File
# This file contains configuration settings for the KGEB framework

[paths]
# Input/Output paths
documents = documents.txt
entities_schema = entities.json
relations_schema = relations.json
output_directory = output
logs_directory = logs
test_results_directory = test_results

[extraction]
# Entity extraction settings
enable_nlp = true
nlp_model = en_core_web_sm
deduplication = true
infer_attributes = true

# Relation extraction settings
cross_reference_entities = true
extract_from_entities = true
validate_consistency = true

[evaluation]
# Evaluation settings
compute_per_type_metrics = true
check_schema_compliance = true
validate_logical_consistency = true
attribute_completeness_threshold = 0.8

[output]
# Output formatting
json_indent = 2
include_metadata = true
timestamp_format = %Y-%m-%d %H:%M:%S

[logging]
# Logging settings
level = INFO
format = %(levelname)s - %(message)s
file_logging = true
console_logging = true

[testing]
# Test settings
verbose = true
coverage = true
html_report = true
junit_xml = true

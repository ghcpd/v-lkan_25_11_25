name: Run tests

on:
  push:
    branches: [ main, oswe-mini-secondary ]
  pull_request:
    branches: [ main, oswe-mini-secondary ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Run pytest
        run: |
          pytest -q
      - name: Print outputs
        run: |
          echo "entities_output.json:" && test -f entities_output.json && cat entities_output.json || echo "(no entities_output.json produced)"
          echo "relations_output.json:" && test -f relations_output.json && cat relations_output.json || echo "(no relations_output.json produced)"
